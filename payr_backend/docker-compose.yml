services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: payr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "3307:3306"
    volumes:
      - payr_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9411" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 1. Config Server (Corrected to start first)
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: config_server
    container_name: config-server
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./config:/config:ro
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 2. Discovery Server (Now depends on Config Server)
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery_server
    container_name: discovery-server
    environment:
      SERVER_PORT: 8761
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 3. Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8081:8081"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 4. User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user_service
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 5. Document Service
  document-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: document_service
    container_name: document-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACESS_KEY: ${ACESS_KEY:-placeholder_key}
      SECRET_KEY: ${SECRET_KEY:-placeholder_secret}
      AWS_REGION: ${AWS_REGION:-ap-south-2}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-payrproject}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8084:8180"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8180/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 6. Loan Service
  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: loan_service
    container_name: loan-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      document-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 7. Notification Service
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification_service
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8086:8084"
    depends_on:
      loan-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 8. Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment_service
    container_name: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-placeholder_razorpay_id}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_razorpay_secret}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8085:8085"
    depends_on:
      notification-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 9. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_32_characters_long}
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      payment-service:
        condition: service_healthy

volumes:
  payr_mysql_data: