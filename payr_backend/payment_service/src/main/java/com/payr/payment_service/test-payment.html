<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAYR - Loan Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .amount {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffcc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            border: 1px solid #00ffcc;
            background: rgba(255, 255, 255, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.5);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">PAYR</div>
        <div class="subtitle">Loan Payment Portal</div>

        <div class="amount" id="amountDisplay">₹ --</div>

        <input type="number" id="loanIdInput" placeholder="Enter Loan ID">
        <input type="email" id="userEmailInput" placeholder="Enter Email">
        <input type="number" id="amountInput" placeholder="Enter Amount">

        <button onclick="pay()">Pay Now</button>

        <div class="footer">Secure payments via Razorpay</div>
    </div>

    <script>
        function pay() {
            var enteredAmount = document.getElementById("amountInput").value;
            var enteredLoanId = document.getElementById("loanIdInput").value;
            var enteredEmail = document.getElementById("userEmailInput").value;

            fetch("http://localhost:8085/payment/create-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    amount: enteredAmount,
                    loanId: enteredLoanId,
                    userEmail: enteredEmail
                })
            })
                .then(res => res.json())
                .then(data => {

                    document.getElementById("amountDisplay").innerText =
                        "₹" + (data.amount / 100) + " Payment";

                    var options = {
                        key: "rzp_test_SZolIhtXLNrr8C",
                        amount: data.amount,
                        currency: "INR",
                        name: "PAYR",
                        order_id: data.orderId,
                        handler: function (response) {
                            console.log("Payment success:", response);

                            fetch("http://localhost:8085/payment/verify", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    razorpayOrderId: response.razorpay_order_id,
                                    razorpayPaymentId: response.razorpay_payment_id,
                                    razorpaySignature: response.razorpay_signature
                                })
                            })
                                .then(res => res.text())
                                .then(data => console.log("Verify response:", data));
                        }
                    };

                    var rzp = new Razorpay(options);
                    rzp.open();
                })
                .catch(err => console.error("Error:", err));
        }
    </script>

</body>

</html>
